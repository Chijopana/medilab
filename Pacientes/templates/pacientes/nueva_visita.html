{% extends 'pacientes/base_panel.html' %}

{% block title %}Pedir cita · Medilab{% endblock %}

{% block panel %}
<div class="panel-head">
    <div>
        <h1 class="panel-title">Pedir cita</h1>
        <p class="panel-lead">Elige profesional, fecha y cuéntanos brevemente el motivo.</p>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'Hub/partials/_form.html' with form=form %}
            <div class="form-acciones">
                <button type="submit" class="btn btn-primary">Solicitar cita</button>
                <a href="{% url 'pacientes/visitas' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
