<div>
    <h2>Inbox</h2>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Remitente</th>
                            <th>Asunto</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inbox-table-body">
                        <!-- Aquí se insertarán los mensajes -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inbox = [
            { remitente: "admin@example.com", asunto: "Actualización de Política", fecha: "2023-07-19" },
            { remitente: "support@example.com", asunto: "Nuevo Mensaje de Soporte", fecha: "2023-07-18" },
            { remitente: "info@example.com", asunto: "Bienvenido a Medilab", fecha: "2023-07-17" },
        ];

        const tableBody = document.getElementById("inbox-table-body");

        function renderTable() {
            tableBody.innerHTML = "";
            inbox.forEach(message => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${message.remitente}</td>
                    <td>${message.asunto}</td>
                    <td>${message.fecha}</td>
                    <td><button class="btn btn-primary btn-sm">Leer</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        renderTable();
    });
</script>
