{% extends 'pacientes/base_panel.html' %}

{% block title %}Modificar visita · Medilab{% endblock %}

{% block panel %}
<div class="panel-head">
    <div>
        <h1 class="panel-title">Modificar visita</h1>
        <p class="panel-lead">Cita del {{ visita.hora_fecha|date:"d/m/Y H:i"|default:"—" }}.</p>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form action="{% url 'pacientes/mod_visita' visita.pk %}" method="post" novalidate>
            {% csrf_token %}
            {% include 'Hub/partials/_form.html' with form=form %}
            <div class="form-acciones">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a href="{% url 'pacientes/visitas' %}" class="btn btn-secondary">Volver</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
