<div>
    <h2>Configuración</h2>
    <form action="{% url 'pacientes/perfil' %}" method="post" class="php-email-form">
        {% csrf_token %}
        {% for field in form1%}
        {% if field.name in 'nombre apellido dni fecha_nacimiento numero_seguro_social'%}
        <div class="mb-3">
            <p class="form-label">{{field.label}}</p>
            <p class="form-label">{{field.value}}</p>
            <input type="hidden" name="{{ field.html_name }}" value="{{ field.value|default_if_none:'' }}">        </div>
        {% else %}
        <div class="mb-3">
            <label for="{{field.id_for_label}}" class="form-label">{{field.label}}</label>
            <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                value="{{ field.value|default_if_none:'' }}" class="form-control">
        </div>
        {%endif%}
        {% endfor %}
        {% for field in form2%}
        <div class="mb-3">
            <label for="{{field.id_for_label}}" class="form-label">{{field.label}}</label>
            <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                value="{{ field.value|default_if_none:'' }}" class="form-control">
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
</div>
