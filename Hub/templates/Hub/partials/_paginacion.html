{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Paginación">
    {% if pagina.has_previous %}
        <a class="btn btn-secondary btn-sm" href="?{% if busqueda %}q={{ busqueda|urlencode }}&amp;{% endif %}page={{ pagina.previous_page_number }}">&larr; Anterior</a>
    {% endif %}
    <span class="actual">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
    {% if pagina.has_next %}
        <a class="btn btn-secondary btn-sm" href="?{% if busqueda %}q={{ busqueda|urlencode }}&amp;{% endif %}page={{ pagina.next_page_number }}">Siguiente &rarr;</a>
    {% endif %}
</nav>
{% endif %}
