<div>
    <h2>Lista de Visitas</h2>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Doctor</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="visits-table-body">
                        <!-- Aquí se insertarán las filas de visitas -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const visits = [
            { paciente: "Juan Pérez", fecha: "2023-07-20", hora: "10:00", doctor: "Dr. Smith" },
            { paciente: "Ana García", fecha: "2023-07-21", hora: "11:00", doctor: "Dr. Johnson" },
            { paciente: "Luis Martínez", fecha: "2023-07-22", hora: "12:00", doctor: "Dr. Brown" },
        ];

        const tableBody = document.getElementById("visits-table-body");

        function renderTable() {
            tableBody.innerHTML = "";
            visits.forEach(visit => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${visit.paciente}</td>
                    <td>${visit.fecha}</td>
                    <td>${visit.hora}</td>
                    <td>${visit.doctor}</td>
                    <td><button class="btn btn-primary btn-sm">Ver</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        renderTable();
    });
</script>
